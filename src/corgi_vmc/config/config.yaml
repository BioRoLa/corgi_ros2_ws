common:
  m: 20.98

  fx_upper_bound: 30
  fx_lower_bound: -30
  fz_upper_bound: 200
  fz_lower_bound: -50

  Kp: [1000, 2000, 0, 0, 0, 300]      # roll, pitch, yaw, x, y, z
  Kd: [50, 100, 0, 0, 0, 150]          # wx, wy, wz, vx, vy, vz
  wrench_weight: [10000, 30000, 0, 0, 0, 6000]
  force_weight: 1e-4

  Mx: 0
  My: 0
  Bx_swing: 80
  By_swing: 80
  Bx_stance: 80
  By_stance: 10
  Kx_swing: 2000
  Ky_swing: 2000
  Kx_stance: 2000
  Ky_stance: 100

  walk:
    stand_height: 0.2
    cruise_velocity: 0.05
    step_length: 0.2
    step_height: 0.08
    ramp_loops: 500

    # Time-driven walk only. At freq=500 Hz, 11000 cycles is 22 s,
    # matching walk_closed_time at 100 Hz with target_loop=2200.
    target_loop: 11000

    # Distance-driven walk only.
    stop_x: 2.0
    decel_margin: 1.2

