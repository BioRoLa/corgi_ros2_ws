# ──────────────────────────────────────────────────────────────
# Common: parameters shared between sim and real (physical constants)
# ──────────────────────────────────────────────────────────────
common:
  m: 23.66
  fx_upper_bound: 10
  fx_lower_bound: -10
  fz_upper_bound: 100

  # ── Walk-only parameters (walk_closed_time / walk_closed_dist) ───────────
  walk:
    stand_height:     0.2     # target body CoM height above ground (m)
    cruise_velocity:  0.1     # maximum forward walking speed (m/s)
    step_length:      0.2     # foot step length (m)
    step_height:      0.08    # foot swing clearance height (m)
    # ramp_loops: velocity ramp-up/down duration in control cycles.
    # At freq=100 Hz, ramp_loops=100 → 1 second ramp time.
    ramp_loops: 100

    # ── Time-driven walk only (walk_closed_time) ────────────────────────────
    # target_loop: total MPC control cycles before the robot stops.
    # Walk duration = target_loop × dt seconds, regardless of distance traveled.
    target_loop: 2200

    # ── Distance-driven walk only (walk_closed_dist) ────────────────────────
    # stop_x:      target stop position on the X axis in the odom/world frame (m).
    # decel_margin: safety multiplier on the computed decel distance;
    #               values > 1.0 start braking earlier than the theoretical minimum.
    stop_x:       3.0
    decel_margin: 1.2

  # ── Trot-only parameters (trot_open) ───────────────────────────────────────
  trot:
    target_pos_z:  0.25   # target body CoM height above ground (m)
    velocity:      0.4    # forward trotting speed (m/s)
    stand_height:  0.25   # body CoM height above ground (m)
    step_length:   0.2    # foot step length (m)
    step_height:   0.06   # foot swing clearance height (m)
    target_loop:   600    # total MPC control cycles before the robot stops

  # ── WLW-only parameters (wlw_open) ────────────────────────────────────────
  # Parameters for the open-loop WLW node that drives Hybrid gait directly.
  wlw:
    velocity:      0.1    # walking velocity (m/s)
    stand_height:  0.16   # body CoM height above ground (m)
    step_length:   0.3    # foot step length (m)
    swing_index:   1      # leg that swings first (0=RF 1=LF 2=LH 3=RH; 1 → diagonal gait)
    target_loop:   3000   # total walk duration in 1 kHz cycles / 10
    ramp_loops:    1000   # velocity ramp-up/down duration in 1 kHz cycles

# ──────────────────────────────────────────────────────────────
# Simulation profile  (ros2 launch ... config_profile:=sim)
# ──────────────────────────────────────────────────────────────
sim:
  # contact_source: gait | gmo
  # NOTE: "gmo" only takes effect when state_source:=esekf is set at launch.
  #        With any other state_source, gmo contact is still read but selection_matrix
  #        behaviour is identical — only meaningful when ESEKF is running.
  contact_source: gait

  Q_diagonal: [
    40,   40,   0,   # roll, pitch, yaw
    0,    0,    100, # x, y, z
    0.01, 0.01, 0,   # ω_x, ω_y, ω_z
    3,    0,    1,   # v_x, v_y, v_z
    0                # additional state
  ]

  Bx_swing: 300
  By_swing: 300
  Bx_stance: 300
  By_stance: 100
  Kx_swing: 3000
  Ky_swing: 3000
  Kx_stance: 3000
  Ky_stance: 1000

  fz_lower_bound: -50

  # init_eta: initial joint angles for simulation robot.
  # Order: [theta_A, beta_A, theta_B, beta_B, theta_C, beta_C, theta_D, beta_D] (rad)
  # TODO: robot's initial pose is dependent on Gait parameters (stand_height, step_length, step_height). 
  #       Could automatically compute from kinematics instead of hardcoding.
  # walk init_eta:
  init_eta: [1.3313651941315507,  0.4032814817188362,
             1.1847611807810603,  0.10626486289107877,
             1.1847611807810603, -0.10626486289107877,
             1.3313651941315507, -0.4032814817188362]
  # trot init_eta:
  # init_eta: [1.6951516460296583,  0.20749622643520274,
  #            1.6951516460296583,  0.20749622643520274,
  #            1.6951516460296583, -0.20749622643520274,
  #            1.6951516460296583, -0.20749622643520274]
  # wlw init_eta: (not yet defined)

# ──────────────────────────────────────────────────────────────
# Real-robot profile  (ros2 launch ... config_profile:=real)
# ──────────────────────────────────────────────────────────────
real:
  # contact_source: gait | gmo
  # NOTE: "gmo" only takes effect when state_source:=esekf is set at launch.
  #        With any other state_source, gmo contact is still read but selection_matrix
  #        behaviour is identical — only meaningful when ESEKF is running.
  contact_source: gmo

  Q_diagonal: [
    40,   40,   0,   # roll, pitch, yaw
    0,    0,    100, # x, y, z
    0.1,  0.1,  0,   # ω_x, ω_y, ω_z
    2,    0,    2,   # v_x, v_y, v_z
    0                # additional state
  ]

  # # The parameters for odom legacy
  # Q_diagonal: [
  #   40,   40,   0,   # roll, pitch, yaw
  #   0,    0,    100, # x, y, z
  #   0.1,  0.1,  0,   # ω_x, ω_y, ω_z
  #   0,    0,    2,   # v_x, v_y, v_z
  #   0                # additional state
  # ]

  Bx_swing: 80
  By_swing: 80
  Bx_stance: 80
  By_stance: 10
  Kx_swing: 2000
  Ky_swing: 2000
  Kx_stance: 2000
  Ky_stance: 200

  fz_lower_bound: -50

  # init_eta: initial joint angles for real robot.
  # Order: [theta_A, beta_A, theta_B, beta_B, theta_C, beta_C, theta_D, beta_D] (rad)
  # TODO: robot's initial pose is dependent on Gait parameters (stand_height, step_length, step_height). 
  #       Could automatically compute from kinematics instead of hardcoding.
  # walk init_eta:
  init_eta: [1.2744470401482761,  0.4161719979302237,
             1.1222141023936798,  0.11005079310996896,
             1.1222141023936798, -0.11005079310996896,
             1.2744470401482761, -0.4161719979302237]
  # trot init_eta:
  # init_eta: [1.6951516460296583,  0.20749622643520274,
  #            1.6951516460296583,  0.20749622643520274,
  #            1.6951516460296583, -0.20749622643520274,
  #            1.6951516460296583, -0.20749622643520274]
  # wlw init_eta: (not yet defined)