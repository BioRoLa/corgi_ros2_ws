# ─────────────────────────────────────────────────────────────────
# Analysis config — WITH Mahalanobis gating (baseline)
# Run: ./offline_test --config config/config_analysis_maha.yaml
# Output: output_data/walk_2m_01_esekf.csv
# ─────────────────────────────────────────────────────────────────

esekf:
  sigma_a:       [5.0, 1.0, 1.0]
  sigma_w:       [0.001, 0.01, 0.001]
  sigma_ba:      [1.0e-5, 1.0e-5, 1.0e-5]
  sigma_bw:      [1.0e-8, 1.0e-8, 1.0e-8]
  sigma_bv:      [1.0e-6, 1.0e-6, 1.0e-6]
  sigma_leg_vec: [0.05, 1.5, 1.2]
  mahalanobis_threshold: 16.27

observer:
  cutoff_freq:        15.0
  encoder_cutoff_freq: 30.0

contact:
  rm_threshold_high:   25.0
  rm_threshold_low:    15.0
  beta_threshold_high: 10.0
  beta_threshold_low:   1.0

simulate_imu_noise: true
use_esekf_state:    true
quiet:              false

offline:
  csv_filename:  walk_2m_01
  start_index:   0
  max_processed: 12000
  rmse_skip:     0
  enable_logging: true
  log_details:   false
  imu_noise_seed: 42

gt_velocity_lpf_cutoff: 10.0
