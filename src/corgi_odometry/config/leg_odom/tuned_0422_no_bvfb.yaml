# ─────────────────────────────────────────────────────────────────
# Tuned parameters — 2026-04-22, dual-dataset grid sweep
# Phase 2 (no bv feedback) — same tuning as tuned_0422_bvfb.yaml
# except use_bv_feedback: false
# ─────────────────────────────────────────────────────────────────

# ES-EKF noise tuning
esekf:
  sigma_a:       [5.0, 3.0, 2.0]
  sigma_w:       [0.001, 0.01, 0.001]
  sigma_ba:      [1.0e-5, 1.0e-4, 5.0e-6]
  sigma_bw:      [1.0e-8, 1.0e-8, 1.0e-8]
  sigma_leg_vec: [0.02, 0.10, 0.8]
  mahalanobis_threshold: 16.27

# Disturbance observer / encoder filter
observer:
  cutoff_freq:         15.0
  encoder_cutoff_freq: 30.0

# Schmitt-trigger contact thresholds
contact:
  rm_threshold_high:   25.0
  rm_threshold_low:    15.0
  beta_threshold_high: 10.0
  beta_threshold_low:   1.0

# Logic switches
simulate_imu_noise: true
use_dynamic_dt:     true
use_esekf_state:    true
quiet:              true

# Offline processing
offline:
  csv_filename:   walk_2m_01
  start_index:    0
  max_processed:  12000
  rmse_skip:      0
  enable_logging: false
  log_details:    false
  imu_noise_seed: 42

# Ground-truth velocity low-pass filter
gt_velocity_lpf_cutoff: 10.0

# Static IMU initialization
static_init:
  window_ms:          200
  motion_gyro_thresh: 0.02
use_bv_feedback: false
