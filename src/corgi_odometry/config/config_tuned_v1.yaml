# Tuned parameters — finalized via dual-dataset grid sweep (walk_2m_01 + walk_obs)
#
# Key tuning rationale:
# - sigma_a_y=3.0:       Allows Vy covariance P_vy to grow → larger Kalman gain → Vy is
#                         observable through leg odometry.
# - sigma_leg_y=1.5:     Large uncertainty keeps filter from trusting biased Vy measurements.
#                         Leg kinematics only observe Vy via ω_y×r_c (pitch-rate coupling).
#                         Unmodeled ω_x, ω_z terms create systematic Vy bias ~50-200 mm/s.
#                         Tight sigma would force filter toward that bias, worsening RMSE.
# - sigma_leg_z=0.8:     Same rationale for Vz — unmodeled angular-rate coupling.
# - sigma_leg_x=0.02:    Vx is well-observed (stance kinematics in sagittal plane).
#                         Tight sigma provides effective Mahalanobis filtering: 100% of
#                         obstacle-contact rejections are Vx-driven (verified on walk_obs).
# - sigma_ba_y=1e-4:     Allows ba_y to track slowly-varying systematic IMU bias.
#                         Grid sweep: 1e-6 vs 1e-4 gives ~0.5 mm/s Vy improvement.
# - mahalanobis=16.27:   χ²(3, p=0.999) — rejects contacts with D²>16.27.
#                         walk_obs: 1.8-4.1% contact steps rejected (all Vx-driven).
#                         Vy rejection threshold: sqrt(16.27)*sigma_leg_y = 6.05 m/s
#                         (physically unreachable → Vy mahalanobis is inactive by design).
#
# Final RMSE (walk_2m_01):  Vx=14.8  Vy=18.4  Vz=10.4  mm/s  (baseline: 15.2/23.5/10.6)
# Final RMSE (walk_obs):    Vx=19.7  Vy=23.0  Vz=17.2  mm/s  (baseline: 20.4/25.5/16.9)

esekf:
  sigma_a: [5.0, 3.0, 2.0]
  sigma_w: [0.001, 0.01, 0.001]
  sigma_ba: [1.0e-05, 1.0e-04, 5.0e-06]
  sigma_bw: [1.0e-08, 1.0e-08, 1.0e-08]
  sigma_leg_vec: [0.02, 1.5, 0.8]
  mahalanobis_threshold: 16.27 # 16.27(default) // 1e+30(no_maha)
observer: { cutoff_freq: 15.0, encoder_cutoff_freq: 30.0 }
contact:
  {
    rm_threshold_high: 25.0,
    rm_threshold_low: 15.0,
    beta_threshold_high: 10.0,
    beta_threshold_low: 1.0,
    gamma_threshold_high: 10.0,
    gamma_threshold_low: 1.0,
  }
simulate_imu_noise: true
use_esekf_state: true
quiet: true
offline: {
    csv_filename: walk_2m_01, # walk_obs // walk_2m_01
    start_index: 0,
    max_processed: 12000,
    rmse_skip: 0,
    enable_logging: true,
    log_details: false,
    imu_noise_seed: 42,
  }
gt_velocity_lpf_cutoff: 10.0
